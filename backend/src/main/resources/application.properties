# Read by com.jobportal.config.ConfigurationManager

# Login session lifetime (Phase 4 replaces sessions with JWT)
auth.session.ttl.minutes=60
auth.password.min.length=8
# PBKDF2 iterations: higher = slower to brute force, slower to log in
auth.pbkdf2.iterations=210000

# Background notification workers
notification.worker.threads=2
# Comma-separated channels each event is delivered on: EMAIL, SMS, IN_APP
notification.channels=IN_APP,EMAIL

# Pagination
pagination.default.size=20
pagination.max.size=100

# REST API server (com.jobportal.api.ApiServer)
server.port=8080
# Origin allowed to call the API from a browser (the Vite dev server)
server.cors.origin=http://localhost:5173
# Load sample users/jobs on startup (storage is in-memory, so data resets on every restart)
demo.data.enabled=true
